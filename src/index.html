<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Codex 余额助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="widget" data-state="idle" data-expanded="true" aria-label="Codex 项目用量助手">
      <div class="aura aura-one" aria-hidden="true"></div>
      <div class="aura aura-two" aria-hidden="true"></div>

      <header class="titlebar">
        <div class="drag-region">
          <span class="live-dot" aria-hidden="true"></span>
          <div class="project-copy">
            <span class="eyebrow">CODEX METER</span>
            <strong id="projectName" title="">正在连接…</strong>
          </div>
        </div>
        <nav class="window-actions" aria-label="窗口控制">
          <button id="pinButton" class="icon-button is-active" type="button" aria-label="取消窗口置顶" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 4 5.5 5.5-3 1.4-3.9 3.9.4 3.7-1.3 1.3-3.5-5.3-4.5-4.5 1.4-1.4 3.7.4 3.9-3.9L10.5 4h4Z"/></svg>
          </button>
          <button id="collapseButton" class="icon-button" type="button" aria-label="折叠详情" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
          </button>
          <button id="minimizeButton" class="icon-button" type="button" aria-label="最小化窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
          </button>
          <button id="closeButton" class="icon-button close-button" type="button" aria-label="关闭窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
        </nav>
      </header>

      <section class="hero" aria-live="polite">
        <div class="quota-ring" role="img" aria-labelledby="quotaTitle quotaValue">
          <svg class="ring-svg" viewBox="0 0 160 160" aria-hidden="true">
            <circle class="ring-track" cx="80" cy="80" r="68"></circle>
            <circle id="quotaArc" class="ring-value" cx="80" cy="80" r="68"></circle>
          </svg>
          <div class="quota-center">
            <span id="quotaTitle">窗口余额</span>
            <strong id="quotaValue">--%</strong>
            <small id="quotaStatus">等待数据</small>
          </div>
        </div>

        <div class="mascot-stage" aria-hidden="true">
          <div class="state-halo"></div>
          <img class="mascot mascot-idle" src="./assets/mascot-idle.webp" alt="" />
          <img class="mascot mascot-working" src="./assets/mascot-working.webp" alt="" />
          <img class="mascot mascot-low" src="./assets/mascot-low.webp" alt="" />
          <img class="mascot mascot-done" src="./assets/mascot-done.webp" alt="" />
        </div>
      </section>

      <section class="status-strip">
        <div class="status-copy">
          <span id="stateLabel" class="status-label">待机中</span>
          <strong id="activeStep">等待 Codex 开始任务</strong>
        </div>
        <span id="progressPercent" class="progress-percent">—</span>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      </section>

      <div class="details" id="details">
        <section class="metric-grid" aria-label="项目用量统计">
          <article class="metric-card primary-metric">
            <span>项目总消耗</span>
            <strong id="totalTokens">—</strong>
            <small id="sessionCount">本机任务日志</small>
          </article>
          <article class="metric-card">
            <span>当前任务</span>
            <strong id="currentTokens">—</strong>
            <small>tokens</small>
          </article>
          <article class="metric-card">
            <span>缓存命中</span>
            <strong id="cacheRate">—</strong>
            <small>输入 token</small>
          </article>
        </section>

        <section class="pulse-card" aria-labelledby="pulseTitle">
          <div class="card-heading">
            <div>
              <span class="eyebrow">LIVE PULSE</span>
              <strong id="pulseTitle">项目消耗趋势</strong>
            </div>
            <span id="deltaBadge" class="delta-badge">+0</span>
          </div>
          <svg id="pulseChart" class="pulse-chart" viewBox="0 0 352 78" role="img" aria-label="最近的项目 token 变化趋势">
            <defs>
              <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#65e7c5" stop-opacity=".34"></stop>
                <stop offset="1" stop-color="#65e7c5" stop-opacity="0"></stop>
              </linearGradient>
            </defs>
            <path class="chart-grid" d="M0 18H352M0 39H352M0 60H352"></path>
            <path id="chartArea" class="chart-area" d=""></path>
            <path id="chartLine" class="chart-line" d=""></path>
            <circle id="chartDot" class="chart-dot" cx="0" cy="0" r="4"></circle>
          </svg>
          <p id="chartSummary" class="sr-only">尚无趋势数据。</p>
        </section>

        <section class="meta-row">
          <div>
            <span>重置倒计时</span>
            <strong id="resetCountdown">—</strong>
          </div>
          <div>
            <span>数据源</span>
            <strong class="source-ok"><i aria-hidden="true"></i>本机只读</strong>
          </div>
        </section>

        <footer>
          <span id="modelName">Codex</span>
          <span id="lastUpdated">等待首次同步</span>
        </footer>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
