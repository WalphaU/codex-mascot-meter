<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Codex 余额 Plus</title>
    <link rel="stylesheet" href="./styles-v2.css" />
  </head>
  <body>
    <main class="widget" data-state="idle" data-mode="compact" aria-label="Codex 项目桌面宠物">
      <div class="detail-surface" aria-hidden="true"></div>
      <div class="aura aura-one" aria-hidden="true"></div>
      <div class="aura aura-two" aria-hidden="true"></div>

      <div class="compact-toolbar">
        <button id="dynamicModeButton" class="round-button dynamic-mode-button" type="button" aria-label="切换到动态桌宠模式" title="动态桌宠">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 9.2c-1.8-1.1-3.5.1-3.5 2 0 1.4 1.1 2.5 2.5 2.5.4 0 .8-.1 1.1-.3M15.8 9.2c1.8-1.1 3.5.1 3.5 2 0 1.4-1.1 2.5-2.5 2.5-.4 0-.8-.1-1.1-.3"></path><path d="M8 9.7C8 7.1 9.7 5 12 5s4 2.1 4 4.7v3.7c0 3-1.7 5.6-4 5.6s-4-2.6-4-5.6Z"></path><path d="M10.1 11.2h.1M13.8 11.2h.1M10.5 14.2c1 .8 2 .8 3 0"></path><path d="m18.4 4 .5 1.2L20 5.7l-1.1.5-.5 1.2-.5-1.2-1.1-.5 1.1-.5Z"></path></svg>
        </button>
        <div class="compact-toolbar-actions">
          <button id="compactModeButton" class="round-button" type="button" aria-label="切换到详细面板">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="7" height="14" rx="2"></rect><rect x="14" y="5" width="6" height="6" rx="2"></rect><path d="M15 16h5M17.5 13.5v5"></path></svg>
          </button>
          <button id="compactCloseButton" class="round-button close-button" type="button" aria-label="关闭窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
          </button>
        </div>
      </div>

      <button id="petButton" class="mascot-shell" type="button" aria-label="打开 codex 项目详细面板">
        <span class="state-halo" aria-hidden="true"></span>
        <img class="mascot mascot-idle" src="./assets/mascot-idle.webp" alt="" />
        <img class="mascot mascot-working" src="./assets/mascot-working.webp" alt="" />
        <img class="mascot mascot-low" src="./assets/mascot-low.webp" alt="" />
        <img class="mascot mascot-done" src="./assets/mascot-done.webp" alt="" />
      </button>

      <section class="compact-hud" aria-live="polite">
        <div class="compact-project-row">
          <span class="live-dot" aria-hidden="true"></span>
          <strong id="compactProjectName">正在连接…</strong>
          <span id="compactState">待机</span>
        </div>
        <div class="compact-meter">
          <div class="compact-meter-label"><span id="compactTaskLabel">任务进度</span><strong id="compactTaskValue">—</strong></div>
          <div class="bar-track"><span id="compactTaskBar" class="task-bar"></span></div>
        </div>
        <div class="compact-meter quota-meter" data-quota-window="five-hour">
          <div class="compact-meter-label"><span>5小时余额</span><strong id="compactFiveHourQuotaValue">—</strong></div>
          <div class="bar-track"><span id="compactFiveHourQuotaBar" class="quota-bar"></span></div>
        </div>
        <div class="compact-meter quota-meter" data-quota-window="weekly">
          <div class="compact-meter-label"><span>周余额</span><strong id="compactWeeklyQuotaValue">—</strong></div>
          <div class="bar-track"><span id="compactWeeklyQuotaBar" class="quota-bar"></span></div>
        </div>
      </section>

      <section id="dynamicPetStage" class="dynamic-pet-stage" aria-label="动态 Codex 桌面宠物" aria-hidden="true" inert>
        <div id="dynamicHoverZone" class="dynamic-hover-zone" aria-hidden="true"></div>
        <button id="dynamicBackButton" class="dynamic-back-button" type="button" aria-label="切换回默认桌宠面板" title="返回默认面板">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"></rect><path d="M8 9h8M8 13h5M8 16h3"></path></svg>
        </button>
        <div id="dynamicPet" class="dynamic-pet" aria-hidden="true">
          <span class="dynamic-ground-shadow" aria-hidden="true"></span>
          <div id="dynamicActor" class="dynamic-actor" data-action="idle" data-pose="idle" data-direction="right">
            <div id="dynamicIdle" class="dynamic-idle" aria-hidden="true"></div>
            <div id="dynamicSequence" class="dynamic-sequence" data-active="false" data-active-slot="0" aria-hidden="true">
              <span class="sequence-frame sequence-frame-a" data-sequence-slot="0"></span>
              <span class="sequence-frame sequence-frame-b" data-sequence-slot="1"></span>
            </div>
            <div id="dragSequence" class="drag-sequence" aria-hidden="true">
              <img class="drag-frame" style="--drag-frame:0" src="./assets/mascot-drag-frame-01.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:1" src="./assets/mascot-drag-frame-02.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:2" src="./assets/mascot-drag-frame-03.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:3" src="./assets/mascot-drag-frame-04.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:4" src="./assets/mascot-drag-frame-05.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:5" src="./assets/mascot-drag-frame-06.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:6" src="./assets/mascot-drag-frame-07.webp" alt="" draggable="false" />
              <img class="drag-frame" style="--drag-frame:7" src="./assets/mascot-drag-frame-08.webp" alt="" draggable="false" />
            </div>
            <div id="dynamicRig" class="dynamic-rig" data-active-slot="0" aria-hidden="true">
              <div class="rig-frame rig-frame-a" data-rig-slot="0">
                <img class="rig-segment rig-head" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-torso" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-arm-left" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-arm-right" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-legs" src="./assets/idle/idle-01.png" alt="" draggable="false" />
              </div>
              <div class="rig-frame rig-frame-b" data-rig-slot="1">
                <img class="rig-segment rig-head" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-torso" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-arm-left" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-arm-right" src="./assets/idle/idle-01.png" alt="" draggable="false" />
                <img class="rig-segment rig-legs" src="./assets/idle/idle-01.png" alt="" draggable="false" />
              </div>
            </div>
            <img class="dynamic-character pose-idle" src="./assets/idle/idle-01.png" alt="" draggable="false" />
            <img class="dynamic-character pose-jump" src="./assets/mascot-action-jump.webp" alt="" draggable="false" />
            <img class="dynamic-character pose-happy" src="./assets/mascot-action-happy.webp" alt="" draggable="false" />
            <img class="dynamic-character pose-drag" src="./assets/mascot-action-drag.webp" alt="" draggable="false" />
            <span class="action-fx" aria-hidden="true"><i class="fx-ring"></i><i class="fx-dot"></i><i class="fx-line"></i><i class="fx-puff"></i></span>
            <span class="drag-struggle-fx" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="click-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div id="dynamicHitTarget" class="dynamic-hit-target" role="button" tabindex="-1" aria-label="动态桌宠，单击互动，拖动可移动"></div>
        </div>
      </section>

      <section class="detail-panel" aria-label="Codex 项目详细数据">
        <header class="titlebar">
          <div class="drag-region">
            <span class="live-dot" aria-hidden="true"></span>
            <div class="project-copy">
              <span class="eyebrow">CURRENT CODEX PROJECT</span>
              <strong id="projectName" title="">正在连接…</strong>
            </div>
          </div>
          <nav class="window-actions" aria-label="窗口控制">
            <button id="modeButton" class="icon-button mode-button" type="button" aria-label="切换到桌宠模式">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="7" height="14" rx="2"></rect><rect x="14" y="5" width="6" height="6" rx="2"></rect><path d="m14.5 16 2.5 2.5 3.5-4"></path></svg>
            </button>
            <button id="minimizeButton" class="icon-button" type="button" aria-label="最小化窗口">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg>
            </button>
            <button id="closeButton" class="icon-button close-button" type="button" aria-label="关闭窗口">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </button>
          </nav>
        </header>

        <section class="hero" aria-live="polite">
          <div class="quota-window-stack" aria-label="Codex 账号额度窗口">
            <article id="fiveHourQuotaCard" class="quota-window-card" data-known="false">
              <div class="quota-mini-ring" aria-hidden="true"><strong id="fiveHourQuotaValue">—</strong></div>
              <div class="quota-window-copy">
                <strong>5小时余额</strong>
                <span id="fiveHourQuotaReset">等待额度数据</span>
                <div class="quota-window-track" aria-hidden="true"><i id="fiveHourQuotaBar"></i></div>
              </div>
            </article>
            <article id="weeklyQuotaCard" class="quota-window-card" data-known="false">
              <div class="quota-mini-ring" aria-hidden="true"><strong id="weeklyQuotaValue">—</strong></div>
              <div class="quota-window-copy">
                <strong>周余额</strong>
                <span id="weeklyQuotaReset">等待额度数据</span>
                <div class="quota-window-track" aria-hidden="true"><i id="weeklyQuotaBar"></i></div>
              </div>
            </article>
          </div>
        </section>

        <section class="status-strip">
          <div class="status-copy">
            <span id="stateLabel" class="status-label">待机中</span>
            <strong id="activeStep">等待 Codex 开始任务</strong>
          </div>
          <span id="progressPercent" class="progress-percent">—</span>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        </section>

        <section class="metric-grid" aria-label="项目用量统计">
          <article class="metric-card primary-metric"><span>项目总消耗</span><strong id="totalTokens">—</strong><small id="sessionCount">Codex 项目累计</small></article>
          <article class="metric-card"><span>当前任务实际消耗</span><strong id="currentTokens">—</strong><small>当前会话 tokens</small></article>
          <article class="metric-card"><span>缓存命中</span><strong id="cacheRate">—</strong><small>项目输入 token</small></article>
        </section>

        <section class="pulse-card" aria-labelledby="pulseTitle">
          <div class="card-heading">
            <div>
              <span class="eyebrow">PROJECT HISTORY</span>
              <strong id="pulseTitle">项目 token 分段消耗</strong>
              <small id="historyRange">正在读取历史日志…</small>
            </div>
            <div class="chart-heading-actions">
              <button id="chartBackButton" class="chart-back-button" type="button" aria-label="返回每日消耗视图" hidden>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"></path></svg><span>按天</span>
              </button>
              <span id="deltaBadge" class="delta-badge">+0</span>
            </div>
          </div>
          <div class="chart-legend"><span><i></i><b id="chartLegendLabel">每日总消耗</b></span><span>单位：tokens</span></div>
          <div class="chart-stage">
            <div id="chartViewport" class="chart-viewport" tabindex="0" aria-label="可横向滚动的历史 token 柱状图">
              <svg id="pulseChart" class="pulse-chart" viewBox="0 0 352 90" role="img" aria-label="当前项目各历史日志区间的新增 token 柱状图">
                <g id="chartGrid" class="chart-grid"></g>
                <g id="chartXAxis" class="chart-axis chart-x-axis"></g>
                <g id="chartBars" class="chart-bars"></g>
                <g id="chartYAxis" class="chart-axis chart-y-axis"></g>
              </svg>
            </div>
            <div id="chartTooltip" class="chart-tooltip" role="status" aria-live="polite" hidden>
              <span id="tooltipTime">—</span><strong id="tooltipValue">—</strong><small id="tooltipDelta">—</small>
            </div>
          </div>
          <div class="history-scroll-control">
            <button id="scrollLeftButton" type="button" aria-label="向左查看更早的消耗数据">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"></path></svg>
            </button>
            <input id="historySlider" type="range" min="0" max="1000" value="1000" step="1" aria-label="横向滑动查看过去至当前的 token 消耗" />
            <button id="scrollRightButton" type="button" aria-label="向右查看更新的消耗数据">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg>
            </button>
          </div>
          <div class="chart-kpis" aria-label="趋势摘要">
            <div><span>历史起点</span><strong id="historyStartValue">—</strong></div>
            <div><span>期间增加</span><strong id="historyAddedValue">—</strong></div>
            <div><span>当前累计</span><strong id="historyCurrentValue">—</strong></div>
          </div>
          <p id="chartSummary" class="sr-only">尚无历史趋势数据。</p>
        </section>

        <section class="meta-row">
          <div><span>最近额度重置</span><strong id="resetCountdown">—</strong></div>
          <div><span>数据口径</span><strong class="source-ok"><i aria-hidden="true"></i>账号额度 / 项目累计</strong></div>
        </section>

        <footer class="runtime-strip" aria-label="当前运行参数">
          <div><span>模型</span><strong id="modelName">—</strong></div>
          <div><span>推理强度</span><strong id="effortValue">—</strong></div>
          <div><span>实时速度</span><strong id="speedValue">待机</strong></div>
          <small id="lastUpdated">等待首次同步</small>
        </footer>
      </section>
    </main>
    <script src="./pet-sequence-adapter.js"></script>
    <script src="./pet-greeting-motion.js"></script>
    <script src="./pet-idle-player.js"></script>
    <script src="./pet-animation-controller.js"></script>
    <script src="./pet-animation-clips.js"></script>
    <script src="./renderer-v2.js"></script>
  </body>
</html>
