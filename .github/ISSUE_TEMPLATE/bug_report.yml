name: Bug 报告
description: 报告可复现的功能或数据显示问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除日志、截图中的账号信息、提示词和私有路径。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 0.2.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序说明如何稳定触发问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供脱敏截图或最小日志片段，请勿上传完整 .codex 日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除提示词、Token、账号信息和私有项目路径。
          required: true
